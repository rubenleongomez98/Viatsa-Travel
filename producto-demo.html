<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizador de demostración — VIATSA Travel</title><link rel="stylesheet" href="css/cotizador.css"><style>:root{--o:#606042;--c:#FFECD2;--l:#E7E0D2}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#29291f;font-family:Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.top{background:var(--o);color:white}.top .wrap{align-items:center;display:flex;min-height:86px}.logo{width:180px}.lang{display:flex;gap:5px;margin-left:auto}.lang button{background:transparent;border:1px solid #ffffff88;border-radius:20px;color:white;cursor:pointer;padding:8px 12px}.lang button.active{background:white;color:var(--o)}.hero{background:linear-gradient(90deg,#303122df,#30312255),url('hero-v2.webp') center/cover;color:white;padding:80px 0}.hero h1{font:400 clamp(45px,8vw,78px)/.98 Georgia,serif;margin:10px 0}.hero p{line-height:1.65;max-width:630px}.demo{padding:34px 0 90px}.footer{background:var(--o);color:white;padding:40px 0}.footer .wrap{display:flex;justify-content:space-between;gap:25px}@media(max-width:600px){.logo{width:145px}.hero{padding:55px 0}.footer .wrap{flex-direction:column}}</style></head><body><header class="top"><div class="wrap"><a href="index.html"><img class="logo" src="brand-logo-white.png" alt="VIATSA Travel"></a><div class="lang" aria-label="Idioma"><button class="active" data-language="es">ES</button><button data-language="en">EN</button></div></div></header><main><section class="hero"><div class="wrap"><small>VIATSA TRAVEL · DEMO</small><h1 data-es="Cotiza tu próxima aventura." data-en="Quote your next adventure.">Cotiza tu próxima aventura.</h1><p data-es="Esta página usa datos ficticios para demostrar el funcionamiento. Sustituiremos el archivo por los precios aprobados de cada ruta." data-en="This page uses fictitious data to demonstrate how it works. We will replace the file with the approved prices for each route.">Esta página usa datos ficticios para demostrar el funcionamiento. Sustituiremos el archivo por los precios aprobados de cada ruta.</p></div></section><section class="demo wrap"><div data-cotizador="ejemplo-ruta-a" data-lang="es"></div></section></main><footer class="footer"><div class="wrap"><span>© VIATSA Travel</span><a href="terminos.html">Términos y condiciones</a></div></footer><script>document.querySelectorAll('[data-language]').forEach(b=>b.addEventListener('click',()=>{const lang=b.dataset.language;document.documentElement.lang=lang;document.querySelectorAll('[data-language]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-es]').forEach(x=>x.textContent=x.dataset[lang]);document.querySelector('[data-cotizador]').dataset.lang=lang}))</script><script src="js/cotizador.js" defer></script><script src="site-common.js?v=1" defer></script></body></html>
